:root{
  --paper:#EEEBF3; --surface:#F9F8FC; --ink:#26233D; --muted:#6C6884; --line:#D9D5E4;
  --accent:#3D3A6B; --on-accent:#F9F8FC; --shadow:0 1px 0 rgba(38,35,61,.06), 0 8px 24px -16px rgba(38,35,61,.35);
  --serif:"Instrument Serif", "Iowan Old Style", Georgia, serif;
  --sans:"Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#16151E; --surface:#211F2C; --ink:#ECE9F5; --muted:#A29EB8; --line:#363341;
    --accent:#C9C3F0; --on-accent:#1B1A26; --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 28px -18px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#16151E; --surface:#211F2C; --ink:#ECE9F5; --muted:#A29EB8; --line:#363341;
  --accent:#C9C3F0; --on-accent:#1B1A26; --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 28px -18px rgba(0,0,0,.8);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%}

/* ---------- estructura ---------- */
.wrap{max-width:760px;margin:0 auto;padding:0 20px 140px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 0 8px}
.brand{display:flex;flex-direction:column;line-height:1}
.brand b{font-family:var(--serif);font-weight:400;font-size:30px;letter-spacing:-.01em}
.brand>span{font-size:13px;color:var(--muted);margin-top:4px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
nav.tabs button{background:none;border:0;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:600}
nav.tabs .plus{justify-self:center;width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--on-accent);padding:0;justify-content:center;margin-top:-18px;box-shadow:var(--shadow)}
nav.tabs .plus span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (min-width:860px){
  nav.tabs{position:static;background:none;backdrop-filter:none;-webkit-backdrop-filter:none;border:0;padding:0;display:flex;gap:4px}
  nav.tabs button{flex-direction:row;font-size:15px;padding:8px 12px;border-radius:999px;gap:6px}
  nav.tabs button svg{width:18px;height:18px}
  nav.tabs button[aria-current="page"]{background:var(--surface)}
  nav.tabs .plus{width:auto;height:auto;border-radius:999px;margin:0 0 0 8px;padding:8px 16px;order:9}
  nav.tabs .plus span{position:static;width:auto;height:auto;overflow:visible;clip:auto}
  .wrap{max-width:860px;padding-bottom:80px}
}

h2.sec{font-family:var(--serif);font-weight:400;font-size:28px;line-height:1.15;margin:40px 0 14px;letter-spacing:-.005em}
p.lead{color:var(--muted);margin:0 0 16px;max-width:60ch}

/* ---------- hoy ---------- */
.greet{font-family:var(--serif);font-weight:400;font-size:clamp(40px,9vw,64px);line-height:1;margin:26px 0 6px;letter-spacing:-.02em}
.today-date{color:var(--muted);margin:0 0 22px}
.strip{display:grid;grid-template-columns:repeat(35,1fr);gap:3px;height:150px;align-items:stretch}
.day{border:0;padding:0;background:none;display:flex;flex-direction:column;gap:2px;border-radius:4px;overflow:hidden;min-width:0}
.day i{flex:1;display:block}
.day.empty{background:linear-gradient(var(--line),var(--line)) center bottom/100% 3px no-repeat}
.day.today{box-shadow:0 0 0 1.5px var(--ink)}
.day:hover:not(.empty){filter:brightness(1.06)}
.strip-cap{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:8px}
@media (prefers-reduced-motion:no-preference){
  .strip.grow .day{transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--n) * 18ms)}
  @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
}
.checkin{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.swatch-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px 6px 6px;font-size:14px}
.swatch-btn i{width:22px;height:22px;border-radius:50%;display:block;background:var(--c)}
.swatch-btn[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}

.resurf{position:relative;border-radius:18px;padding:26px 24px 22px;background:color-mix(in srgb,var(--c) 20%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 40%,var(--line))}
.resurf .when{font-size:14px;color:var(--muted)}
.resurf h3{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.1;margin:6px 0 10px}
.resurf p{font-family:var(--serif);font-style:italic;font-size:21px;line-height:1.4;margin:0 0 16px;max-width:52ch}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* ---------- fichas ---------- */
.fichas{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.ficha{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px 16px 14px 22px;position:relative;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow);min-height:130px}
.ficha::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;border-radius:10px 0 0 10px;background:var(--band)}
.ficha:hover{border-color:color-mix(in srgb,var(--ink) 30%,var(--line))}
.ficha-meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.ficha-title{font-family:var(--serif);font-size:22px;line-height:1.15}
.ficha-source{font-size:13.5px;color:var(--muted);margin-top:-2px}
.ficha-text{font-size:14.5px;color:color-mix(in srgb,var(--ink) 80%,var(--muted));display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ficha-tags{font-size:12.5px;color:var(--muted);margin-top:auto;padding-top:4px}
.month{font-family:var(--serif);font-size:22px;margin:28px 0 10px;color:var(--muted)}
.month:first-letter{text-transform:uppercase}

/* ---------- botones y campos ---------- */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-size:15px;font-weight:500}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.quiet{background:none;border-color:transparent;color:var(--muted);padding-left:8px;padding-right:8px}
.btn.danger{color:#B23A48}
.btn.armed{background:#B23A48;color:#fff;border-color:#B23A48}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:14px}
.chip i{width:12px;height:12px;border-radius:50%;background:var(--c);display:block}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .x{opacity:.6;margin-left:2px}
label.f{display:block;font-size:14px;font-weight:500;margin:18px 0 6px}
label.f small{font-weight:400;color:var(--muted)}
.in,textarea.in,select.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px}
textarea.in{min-height:120px;resize:vertical;font-family:var(--serif);font-size:19px;line-height:1.45}
.search{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 12px}
.search .in{flex:1 1 220px}
.search select.in{flex:0 1 auto;width:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{border:0;background:none;border-radius:999px;padding:6px 14px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.emorow{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px}

/* ---------- paleta ---------- */
.palette{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.pal{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column}
.pal .block{height:110px;background:var(--c);border:0;display:block;width:100%;position:relative}
.pal .block span{position:absolute;right:10px;bottom:8px;font-size:13px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.pal .body{padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px}
.pal .name{border:0;background:none;font-family:var(--serif);font-size:22px;padding:2px 0;width:100%;border-bottom:1px dashed transparent}
.pal .name:focus{border-bottom-color:var(--line);outline:none}
.pal .tools{display:flex;justify-content:space-between;align-items:center}
.pal input[type=color]{width:34px;height:28px;border:1px solid var(--line);border-radius:6px;padding:0;background:none}
.drawers{display:flex;flex-direction:column;gap:8px}
.drawer{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:6px 6px 6px 12px}
.drawer input{flex:1;border:0;background:none;font-size:16px;padding:6px 0}
.drawer small{color:var(--muted);white-space:nowrap}
.note{font-size:14px;color:var(--muted);max-width:60ch}

/* ---------- informe ---------- */
.rep-head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-top:24px}
.period{display:flex;align-items:center;gap:6px}
.period strong{font-family:var(--serif);font-weight:400;font-size:24px;min-width:9ch;text-align:center}
.period strong:first-letter{text-transform:uppercase}
.compo{display:flex;height:220px;border-radius:16px;overflow:hidden;margin:20px 0 10px;border:1px solid var(--line)}
.compo div{background:var(--c);min-width:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.narr{font-family:var(--serif);font-size:24px;line-height:1.4;margin:26px 0 0;max-width:40ch}
.words{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-top:6px}
.words button{border:0;background:none;padding:0;font-family:var(--serif);color:var(--ink)}
.quote{border-left:3px solid var(--c);padding:4px 0 4px 16px;margin:0}
.quote p{font-family:var(--serif);font-style:italic;font-size:22px;line-height:1.4;margin:0 0 6px}
.quote cite{font-style:normal;font-size:14px;color:var(--muted)}
.link{border:0;background:none;padding:0;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line);font-family:var(--serif);font-size:inherit}

/* ---------- constelación ---------- */
.sky{position:relative;border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:background .2s}
.sky svg{display:block;width:100%;height:auto;max-height:72vh;user-select:none;-webkit-user-select:none}
@media (max-width:600px){.sky svg{max-height:none;min-height:60vh}}
.sky g.node{cursor:pointer;transition:opacity .2s}
.sky g.node:focus{outline:none}
.sky g.node:focus circle.dot{stroke:currentColor;stroke-width:2}
.sky text{font-family:var(--sans);pointer-events:none}
.sky line.edge{transition:opacity .2s}
#skysvg.has-sel g.node:not(.lit){opacity:.14}
#skysvg.has-sel line.edge:not(.lit){opacity:.06}
.sky-ctrl{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px}
.sky-ctrl button{width:38px;height:38px;border-radius:50%;border:1px solid rgba(128,124,150,.35);background:rgba(249,248,252,.88);color:#26233D;font-size:19px;line-height:1;padding:0;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.sky-info{position:absolute;left:10px;right:10px;bottom:10px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}

/* ---------- diálogos ---------- */
dialog{border:0;padding:0;background:var(--paper);color:var(--ink);width:min(680px,100%);max-height:100%;border-radius:18px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(20,18,32,.45)}
.dlg{padding:22px 22px 26px;overflow:auto;max-height:calc(100dvh - 40px)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlg-head h2{font-family:var(--serif);font-weight:400;font-size:28px;margin:0}
@media (max-width:640px){
  dialog{width:100%;height:100%;max-width:100%;max-height:100%;border-radius:0;margin:0}
  .dlg{max-height:100%;height:100%;padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(26px + env(safe-area-inset-bottom,0px))}
}
.detail-title{font-family:var(--serif);font-weight:400;font-size:36px;line-height:1.08;margin:14px 0 4px}
.detail-text{font-family:var(--serif);font-size:21px;line-height:1.5;white-space:pre-wrap;margin:18px 0}
.wash{border-radius:14px;padding:18px;background:color-mix(in srgb,var(--c) 16%,var(--surface))}
.mini{display:flex;flex-direction:column;gap:6px}
.mini button{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px}
.mini button i{width:10px;align-self:stretch;border-radius:3px;background:var(--c);flex:none}
.mini button span{display:flex;flex-direction:column;line-height:1.25}
.mini button small{color:var(--muted)}
.err{color:#B23A48;font-size:14px;margin-top:10px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.empty-state{border:1px dashed var(--line);border-radius:16px;padding:28px 22px;margin-top:20px}
.empty-state p{margin:0 0 14px;max-width:52ch}
.story-prev{display:flex;justify-content:center;margin:14px 0}
.story-prev img{width:min(300px,70vw);border-radius:14px;box-shadow:var(--shadow)}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:15px;z-index:50;max-width:calc(100% - 32px);text-align:center;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}
@media (min-width:860px){.toast{bottom:32px}}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.me{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-family:var(--serif);font-size:20px;display:inline-flex;align-items:center;justify-content:center;padding:0;margin-left:auto}
.me[aria-current="page"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
@media (min-width:860px){.me{margin-left:8px}}
.brand b,.brand>span{white-space:nowrap}
nav.tabs .plus span{white-space:nowrap}
ol.steps{margin:18px 0 0;padding-left:1.4em;font-size:17px;line-height:1.5}
ol.steps li{margin:0 0 10px;padding-left:4px}
ol.care{font-size:15.5px;color:color-mix(in srgb,var(--ink) 82%,var(--muted))}
ol.care li{margin-bottom:14px}
ol.care strong{display:block;color:var(--ink);font-weight:600}
.plus-badge{display:inline-block;align-self:flex-start;font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--ink);color:var(--paper);vertical-align:middle;line-height:1.5}
.ficha-photo{display:block;margin:-14px -16px 10px -14px;aspect-ratio:16/9;overflow:hidden;border-radius:0 10px 0 0;background:var(--line)}
.ficha-photo img,.resurf-photo img,.g-tile img,.pe img,.photos-item img{width:100%;height:100%;object-fit:cover;display:block}
.resurf-photo{margin:-26px -24px 18px;aspect-ratio:3/2;overflow:hidden;border-radius:18px 18px 0 0;background:var(--line)}
.photos{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:-18px -18px 16px;border-radius:14px 14px 0 0}
.photos-item{flex:0 0 100%;scroll-snap-align:start;aspect-ratio:4/3;background:var(--line)}
.photos.multi .photos-item{flex-basis:86%}
.photo-edit{display:flex;gap:10px;flex-wrap:wrap}
.pe,.pe-add{position:relative;width:88px;height:88px;border-radius:12px;overflow:hidden;background:var(--line);flex:none}
.pe-x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(20,18,32,.72);color:#fff;font-size:13px;padding:0}
.pe-add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1.5px dashed color-mix(in srgb,var(--ink) 25%,var(--line));background:var(--surface);cursor:pointer;color:var(--muted);font-size:26px;line-height:1;padding:0}
.pe-add small{font-size:12px;line-height:1.2;text-align:center;padding:0 4px}
.colors-box{display:flex;flex-direction:column;gap:8px;margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.sw{width:30px;height:30px;border-radius:8px;display:inline-block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.link-plain{border:0;background:none;padding:0;text-align:left;color:var(--ink);font-size:14px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:color-mix(in srgb,var(--ink) 30%,transparent)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.g-tile{border:0;padding:0;aspect-ratio:1;overflow:hidden;border-radius:8px;background:var(--line);position:relative}
.g-tile::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--c)}
.missing img{visibility:hidden}
.plus-list{margin:10px 0 0;padding-left:1.2em;line-height:1.7}
a.btn{text-decoration:none;display:inline-block}
.stats-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));margin-top:6px}
.card{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px}
.card h3{font-family:var(--serif);font-weight:400;font-size:20px;margin:0 0 10px}
.chart{display:block;width:100%;height:auto}
.ch-t{fill:var(--muted);font-family:var(--sans);font-size:9px}
.ch-axis{stroke:var(--line);stroke-width:1}
.donut-wrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.donut{width:150px;height:150px;flex:none}
.d-big{fill:var(--ink);font-family:var(--serif);font-size:34px}
.d-small{fill:var(--muted);font-family:var(--sans);font-size:11px}
.hbar{display:grid;grid-template-columns:minmax(70px,34%) 1fr auto;gap:8px;align-items:center;font-size:14px;margin:6px 0}
.hbar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-track{height:10px;border-radius:999px;background:color-mix(in srgb,var(--line) 60%,transparent);overflow:hidden}
.hb-track i{display:block;height:100%;border-radius:999px}
.hbar b{font-weight:500;color:var(--muted);font-size:13px;min-width:2.2em;text-align:right}
.cmp{margin:8px 0}
.cmp-name{font-size:14px;display:flex;align-items:center;gap:6px;margin-bottom:3px}
.cmp-name i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.cmp-row{display:grid;grid-template-columns:4.6em 1fr 2.8em;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper)}
.tile b{display:block;font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.1}
.tile span{font-size:13px;color:var(--muted)}
.locked{position:relative}
.locked-inner{filter:blur(7px) saturate(.9);opacity:.75;pointer-events:none;user-select:none;max-height:520px;overflow:hidden}
.locked-cta{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px}
.locked-cta p{max-width:34ch;margin:0;background:var(--surface);padding:14px 16px;border-radius:14px;box-shadow:var(--shadow);font-size:15px}
.ficha-quote{font-family:var(--serif);font-style:italic;font-size:16.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.ymap{display:grid;gap:3px;align-items:center}
.ymap .h{font-size:11px;color:var(--muted);text-align:center;line-height:1.6}
.ymap .dl{font-size:10px;color:var(--muted);text-align:right;padding-right:3px;line-height:1}
.ycell{aspect-ratio:1;border-radius:4px;border:0;padding:0;background:color-mix(in srgb,var(--line) 60%,transparent);display:block;width:100%}
.ycell.none{background:transparent}
.ycell.today{box-shadow:0 0 0 1.5px var(--ink)}
.ycell.has:hover{filter:brightness(1.07)}
.wmap .ycell{font-size:11px;color:var(--muted);text-align:left;padding:4px 5px;display:flex;align-items:flex-start}
.wmap .ycell.has{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.map-scroll{overflow-x:auto;padding-bottom:4px}
.daystrip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.daystrip button{border:0;padding:0;background:none;display:flex;flex-direction:column;gap:4px;align-items:stretch;font-size:11px;color:var(--muted)}
.daystrip i{display:block;height:44px;border-radius:6px;background:color-mix(in srgb,var(--line) 60%,transparent)}
.daystrip .cur i{box-shadow:0 0 0 2px var(--ink)}
.daynav{display:flex;gap:8px;align-items:center;margin:12px 0 4px}
.daynav input{flex:1}
.cmprow{display:grid;grid-template-columns:minmax(90px,32%) 1fr;gap:10px;align-items:center;margin:8px 0;font-size:14px;border:0;background:none;padding:0;text-align:left;width:100%;color:inherit}
.cmprow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmprow small{color:var(--muted)}
.cmpbar{display:flex;height:16px;border-radius:999px;overflow:hidden;background:var(--line)}
.cmpbar i{display:block;height:100%}
.cmprow.sel span{font-weight:600}
.cmprow.sel .cmpbar{box-shadow:0 0 0 2px var(--ink)}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card-tile{border:0;padding:0;background:none;text-align:left;display:flex;flex-direction:column;gap:4px;color:inherit}
.card-tile img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:12px;background:var(--line);box-shadow:var(--shadow);display:block}
.card-tile span{font-size:13.5px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-tile small{font-size:12px;color:var(--muted)}
.seg{max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{white-space:nowrap}
#main[data-arch="tarjetas"] .search,#main[data-arch="tarjetas"] .emorow,#main[data-arch="tarjetas"] .goday-row,#main[data-arch="tarjetas"] .active-filters{display:none}
</style>
</head>
<body>

  careLead:"Your memories only live on this phone: there's no copy anywhere else. That keeps them private, but it also means that if they're lost here, I can't get them back. These five things keep them safe:",

    ['Install me on your home screen.',"If you only open me in the browser, your phone may delete my data if you don't come back for a while."],
    ['Save a copy every now and then.','I remind you as often as you choose. Keep it in Files, in Drive or email it to yourself: it is your lifeline.'],

  careCloud:"Your memories are saved to your account, so they don't depend on this phone. Even so, save a copy every now and then: it is your lifeline if something ever goes wrong.",
  privTitle:'Only yours',
  privOnb:c=>c?'Your memories are saved to your account and are private: nobody else can see them, not even whoever made this app.':"Your memories only live on this phone. I don't send them anywhere: no servers, no ads, nobody reading. Not even I can see them.",
  privSec:'Your privacy',
  privText:c=>c?'Everything you write (memories, emotions, tags, drawers and your profile) is saved to your account and only you can see it. Nothing leaves here unless you choose to share it, like a backup or a card for stories.':"Everything you write (memories, emotions, tags, drawers and your profile) is saved only on this device. I have no server, no analytics and no ads, and I only connect to the internet to update myself. Nothing leaves here unless you decide: a backup or a card for stories. That said, anyone with your unlocked phone could open me, like any other app.",

  seed:[
    ['One Hundred Years of Solitude','Reread on the train. It still feels to me like a family’s memory is a house that keeps repeating itself.',['family','memory','train']],
    ['Slow Sunday','Coffee on the balcony, nobody in a hurry. Bill Evans was playing and the light came in sideways.',['sunday','jazz','home']],
    ['Aftersun','I left the cinema without speaking. A holiday with a father seen from very far away, like a photo developed too late.',['father','summer','memory']],
    ['Blue in Green','I put it on when I want the day to turn its volume down.',['jazz','night']],
    ['Breakwater at sunset','Salty wind, people fishing, a dog that belonged to nobody.',['sea','summer']],
    ['A rehearsal that just worked','The bridge finally clicked. I hummed all the way home.',['music','rehearsal']],
    ['Filing by colour','What if I remembered things by how they felt and not by when they happened?',['memory','ideas']],
    ['Grandma','She smelled of quince and hairspray. She told the same stories and every time they were different.',['family','childhood']],
    ['Stoner','A small life told with enormous dignity. It left me with a long silence.',['work','life']],
    ['Monday with a knot','Too many emails, not enough headspace. I walked for half an hour and something loosened.',['work','walking']],
    ['Perfect Days','Wanting to look at the trees at midday and have a routine of my own.',['routine','light']],
    ['The village house','The green shutters, the hum of the old fridge, the compulsory siesta.',['childhood','summer','home']],
    ['Sleepless night','Going round and round a conversation still waiting to happen.',['night']],
    ['Mediterráneo','My father used to sing it while driving, with the window down.',['father','sea','childhood']],
    ['Papyrus','Books as a way of not being alone across the centuries.',['memory','books']],
    ['First day of autumn','Light rain, hot soup and a brand-new notebook.',['autumn','home']]
  ]
},

  careLead:`Els teus records només viuen en aquest telèfon: no n'hi ha cap còpia enlloc més. Això els fa privats, però també vol dir que, si es perden aquí, no els puc recuperar. Aquestes cinc coses els mantenen a recer:`,

  privTitle:'Només teu',
  privOnb:c=>c?`Els teus records es desen al teu compte i són privats: ningú més els pot veure, tampoc qui ha creat aquesta app.`:`Els teus records només viuen en aquest telèfon. No els envio enlloc: no hi ha servidors, ni anuncis, ni ningú llegint. Ni tan sols jo els puc veure.`,
  privSec:'La teva privacitat',
  privText:c=>c?`Tot el que escrius (records, emocions, etiquetes, calaixos i el teu perfil) es desa al teu compte i només tu ho pots veure. Només surt d'aquí el que tu decideixis compartir, com una còpia de seguretat o una targeta per a stories.`:`Tot el que escrius (records, emocions, etiquetes, calaixos i el teu perfil) es desa només en aquest dispositiu. No tinc servidor, ni analítica, ni publicitat, i només em connecto a internet per actualitzar-me. Només surt d'aquí el que tu decideixis: una còpia de seguretat o una targeta per a stories. Això sí, qui tingui el teu telèfon desbloquejat podria obrir-me, com qualsevol altra app.`,

function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}

function range(p,o){
  const now=new Date();now.setHours(0,0,0,0);let s,e,label;
  if(p==='semana'){const dow=(now.getDay()+6)%7;s=addDays(now,-dow+o*7);e=addDays(s,6);
    label=fmtD(s,{day:'numeric',month:'short'})+' – '+fmtD(e,{day:'numeric',month:'short'})}
  else if(p==='mes'){s=new Date(now.getFullYear(),now.getMonth()+o,1);e=new Date(s.getFullYear(),s.getMonth()+1,0);label=fmtD(s,{month:'long',year:'numeric'})}
  else{s=new Date(now.getFullYear()+o,0,1);e=new Date(s.getFullYear(),11,31);label=String(s.getFullYear())}
  return {s:iso(s),e:iso(e),label};
}
function stats(r){
  const ms=S.memories.filter(m=>m.date>=r.s&&m.date<=r.e);
  const ec={},tc={},ty={};const days=new Set();
  ms.forEach(m=>{days.add(m.date);(m.emotions||[]).forEach((id,i)=>{if(emo(id))ec[id]=(ec[id]||0)+(i===0?1:.5)});(m.tags||[]).forEach(x=>tc[x]=(tc[x]||0)+1);ty[m.type]=(ty[m.type]||0)+1});
  const total=Object.values(ec).reduce((a,b)=>a+b,0);
  const emos=Object.entries(ec).sort((a,b)=>b[1]-a[1]).map(([id,v])=>({e:emo(id),share:v/total}));
  const tags=Object.entries(tc).sort((a,b)=>b[1]-a[1]);
  const types=Object.entries(ty).sort((a,b)=>b[1]-a[1]);
  return {ms,emos,tags,types,days:days.size};
}
function discovered(ms){
  let best=null,bs=0;
  for(const a of ms)for(const b of S.memories){
    if(a.id===b.id||a.type===b.type||(a.links||[]).includes(b.id))continue;
    const st=(a.tags||[]).filter(x=>(b.tags||[]).includes(x));const se=(a.emotions||[]).filter(e=>(b.emotions||[]).includes(e));
    const sc=st.length*2+se.length;if(st.length&&se.length&&sc>bs){bs=sc;best={a,b,st,se}}
  }
  return best;
}

function addTag(raw){
  raw.split(',').map(s=>s.trim().toLowerCase().replace(/^#/,'')).filter(Boolean).forEach(x=>{if(!draft.tags.includes(x))draft.tags.push(cut(x,40))});
}
async function saveDraft(){
  const tagIn=$('#ed-tag');if(tagIn&&tagIn.value.trim())addTag(tagIn.value);
  if(!draft.title.trim()&&!draft.text.trim()){edErr=t('errEmpty');renderEditor();return}
  if(!/^\d{4}-\d{2}-\d{2}$/.test(draft.date))draft.date=iso(new Date());
  const isNew=!draft.id;const prev=isNew?null:memOf(draft.id);
  const m={...draft,id:draft.id||mkid('m'),title:draft.title.trim(),source:(draft.source||'').trim(),text:draft.text.trim(),createdAt:prev?.createdAt||Date.now(),updatedAt:Date.now()};
  if(!typeOf(m.type).src)m.source='';
  m.quote=typeOf(m.type).q?(draft.quote||'').trim():'';m.page=typeOf(m.type).page?String(draft.page||'').trim():'';if(!m.quote)delete m.quote;if(!m.page)delete m.page;
  delete m._new;delete m._saved;delete m._colors;m.drawers=[...(draft.drawers||[])];normDrawers(m);m.photos=[...(draft.photos||[])];draft._saved=true;
  (prev&&prev.photos||[]).filter(x=>!m.photos.includes(x)).forEach(dropPhoto);(draft._new||[]).filter(x=>!m.photos.includes(x)).forEach(dropPhoto);
  if(isNew)S.memories.push(m);else S.memories[S.memories.findIndex(x=>x.id===m.id)]=m;
  const before=prev?prev.links||[]:[];
  const touched=[];
  m.links.forEach(l=>{const o=memOf(l);if(o&&!(o.links||[]).includes(m.id)){o.links=[...(o.links||[]),m.id];touched.push(o)}});
  before.filter(l=>!m.links.includes(l)).forEach(l=>{const o=memOf(l);if(o){o.links=(o.links||[]).filter(x=>x!==m.id);touched.push(o)}});
  closeDlg();
  const rel=related(m)[0];
  toast(isNew?(rel?t('tSavedRel',cut(memTitle(rel),30)):t('tSavedN',S.memories.length)):t('tChanged'));
  render();
  await saveMem(m);for(const o of touched)await saveMem(o);
}
async function deleteMem(id){
  const m=memOf(id);if(!m)return;
  S.memories=S.memories.filter(x=>x.id!==id);(m.photos||[]).forEach(dropPhoto);
  const touched=S.memories.filter(o=>(o.links||[]).includes(id));touched.forEach(o=>o.links=o.links.filter(x=>x!==id));
  closeDlg();toast(t('tDeleted'));render();
  await deleteMemCloud(id);for(const o of touched)await saveMem(o);
}

async function deliverFile(name,data,mime,opts={}){
  if(downloads){try{await downloads.save({filename:name,data});return 'ok'}catch(e){if(e&&e.code==='declined')return 'declined'}}
  if(window.claude)return 'fallback';
  const blob=data instanceof Blob?data:new Blob([data],{type:mime});
  try{
    const f=new File([blob],name,{type:mime});
    const pf=platform();const useShare=pf==='ios'||(pf==='android'&&!opts.download);
    if(useShare&&navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:t('brand')});return 'ok'}
  }catch(e){if(e&&e.name==='AbortError')return 'declined'}
  const u=URL.createObjectURL(blob);const el=document.createElement('a');el.href=u;el.download=name;document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);
  return 'ok';
}

  if(full===false)payload.cards=[];
  if(full!==false&&(S.cards||[]).length){const ci={};for(const c of S.cards){try{const bb=await IDB.get(c.id,'cards');if(bb)ci[c.id]=await blobToDataURL(bb)}catch(e){}}payload.cardImgs=ci}
  if(full!==false&&hasPhotos()){toast(t('exportPreparing'));const photos={};for(const pid of new Set(S.memories.flatMap(m=>m.photos||[]))){try{const b=await IDB.get(pid);if(b)photos[pid]=await blobToDataURL(b)}catch(e){}}payload.photos=photos}
  const data=JSON.stringify(payload);
  const name='memorandum-'+iso(new Date())+(payload.photos?'-fotos':'')+'.json';
  const r=await deliverFile(name,data,'application/json',{download:true});
  if(r==='ok'){S.settings.lastBackup=iso(new Date());S.settings.snoozeUntil=null;savePalette();toast(!window.claude&&platform()==='android'?t('tSavedDownloads'):t('tBackup'));render();return}

  openDlg(`<div class="dlg-head"><h2>${t('yourCopy')}</h2><button class="btn quiet" data-act="close">${t('close')}</button></div><p class="note">${esc(t('copyText'))}</p><textarea class="in" readonly style="min-height:300px;font-family:monospace;font-size:13px">${esc(data)}</textarea>
  <div class="actions"><button class="btn primary" data-act="mark-backup">${esc(t('copied'))}</button></div>`);
}
$('#importer').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const p=JSON.parse(await f.text());
    if(!Array.isArray(p.emotions)||!Array.isArray(p.memories))throw 0;
    const fresh=S.memories.length===0;
    const merge=(cur,inc)=>{const m=new Map((cur||[]).map(x=>[x.id,x]));(inc||[]).forEach(x=>{if(x&&x.id&&(fresh||!m.has(x.id)))m.set(x.id,x)});return [...m.values()]};
    S.emotions=merge(S.emotions,p.emotions);S.drawers=merge(S.drawers,p.drawers);S.customTypes=merge(S.customTypes,p.customTypes);S.cards=merge(S.cards||[],(p.cards||[]).filter(c=>c&&p.cardImgs&&p.cardImgs[c.id]));
    const mm=new Map(S.memories.map(x=>[x.id,x]));
    p.memories.forEach(x=>{if(!x||!x.id)return;const c=mm.get(x.id);if(!c||(x.updatedAt||x.createdAt||0)>(c.updatedAt||c.createdAt||0))mm.set(x.id,x)});
    S.memories=[...mm.values()];
    if(p.cardImgs&&typeof p.cardImgs==='object'){for(const [cid,u] of Object.entries(p.cardImgs)){try{if(typeof u==='string'&&u.startsWith('data:image/'))await IDB.put(cid,dataURLToBlob(u),'cards')}catch(err){}}}
    if(p.photos&&typeof p.photos==='object'){for(const [pid,u] of Object.entries(p.photos)){try{if(typeof u==='string'&&u.startsWith('data:image/'))await IDB.put(pid,dataURLToBlob(u))}catch(err){}}}
    if(p.profile)Object.keys(p.profile).forEach(k=>{if(!S.profile[k])S.profile[k]=p.profile[k]});
    if(!S.settings.lastBackup&&typeof p.exportedAt==='string')S.settings.lastBackup=p.exportedAt.slice(0,10);
    if(p.settings){if(p.settings.lastBackup&&!S.settings.lastBackup)S.settings.lastBackup=p.settings.lastBackup;if(fresh&&p.settings.backupFreq)S.settings.backupFreq=p.settings.backupFreq}
    if(p.settings&&p.settings.plus&&p.settings.plus.code&&!(S.settings.plus&&S.settings.plus.code))S.settings.plus=p.settings.plus;
    S.settings.onboarded=true;ensureSettings();checkPlus();
    if(dlg.open){onbOpen=false;closeDlg()}
    applyLang();render();toast(t('tImported',S.memories.length));
    await savePalette();for(const m of S.memories)await saveMem(m);
  }catch(err){toast(t('tBadFile'))}
});

function backupDue(){
  const d=FREQ_DAYS[S.settings.backupFreq];if(!d||!S.memories.length)return false;
  const today=iso(new Date());
  if(S.settings.snoozeUntil&&S.settings.snoozeUntil>today)return false;
  if(!S.settings.lastBackup)return S.memories.length>=3;
  return daysAgo(S.settings.lastBackup)>=d;
}
function backupBanner(){
  if(!backupDue())return '';

  return `<div class="wash" style="--c:var(--accent);margin-top:28px"><p style="margin:0 0 12px">${esc(t('due',t('freqAdj')[S.settings.backupFreq])+(lb?t('dueLast',fmt(lb,{day:'numeric',month:'long'})):t('dueNone')))}</p>

}
const SNAP='memorandum.snapshots';
function getSnaps(){try{return JSON.parse(localStorage.getItem(SNAP)||'[]')}catch(e){return []}}
function autoSnapshot(){
  if(!S.memories.length)return;
  const today=iso(new Date());let snaps=getSnaps();
  if(snaps[0]&&snaps[0].date===today)snaps[0]={date:today,n:S.memories.length,data:S};
  else snaps.unshift({date:today,n:S.memories.length,data:S});
  snaps=snaps.slice(0,7);
  while(snaps.length){try{localStorage.setItem(SNAP,JSON.stringify(snaps));break}catch(e){snaps.pop()}}
}

/* ---------- Fotos: se guardan solo en este dispositivo (IndexedDB) ---------- */
const PHOTO_MAX_FREE=1, PHOTO_MAX_PLUS=5;
const IDB={db:null,
  open(){if(this.db)return Promise.resolve(this.db);return new Promise((res,rej)=>{let r;try{r=indexedDB.open('memorandum',2)}catch(e){rej(e);return}r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos');if(!d.objectStoreNames.contains('cards'))d.createObjectStore('cards')};r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>rej(r.error)})},
  async tx(mode,fn,store='photos'){const db=await this.open();return new Promise((res,rej)=>{const tx=db.transaction(store,mode);const rq=fn(tx.objectStore(store));let out;if(rq)rq.onsuccess=()=>{out=rq.result};tx.oncomplete=()=>res(out);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)})},
  put(id,blob,store){return this.tx('readwrite',st=>st.put(blob,id),store)},
  get(id,store){return this.tx('readonly',st=>st.get(id),store)},
  del(id,store){return this.tx('readwrite',st=>st.delete(id),store)}
};
const photoURLs=new Map();
async function photoURL(id){if(photoURLs.has(id))return photoURLs.get(id);try{const b=await IDB.get(id);if(!b)return null;const u=URL.createObjectURL(b);photoURLs.set(id,u);return u}catch(e){return null}}
function dropPhoto(id){const u=photoURLs.get(id);if(u){URL.revokeObjectURL(u);photoURLs.delete(id)}IDB.del(id).catch(()=>{})}
function hydratePhotos(root){(root||document).querySelectorAll('img[data-photo]:not([src])').forEach(async img=>{const u=await photoURL(img.dataset.photo);if(u)img.src=u;else if(img.parentElement)img.parentElement.classList.add('missing')});(root||document).querySelectorAll('img[data-card]:not([src])').forEach(async img=>{const u=await cardURL(img.dataset.card);if(u)img.src=u})}
function photoLimit(){return isPlus()?PHOTO_MAX_PLUS:PHOTO_MAX_FREE}
function hasPhotos(){return S.memories.some(m=>(m.photos||[]).length)}
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
async function processPhoto(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await loadImg(url);
    let w=img.naturalWidth,h=img.naturalHeight;if(!w||!h)throw 0;
    const k=Math.min(1,1600/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.82));if(!blob)throw 0;
    const s=document.createElement('canvas');s.width=48;s.height=48;const sx=s.getContext('2d',{willReadFrequently:true});sx.drawImage(img,0,0,48,48);
    return {blob,colors:analyzeColors(sx.getImageData(0,0,48,48).data)};
  }finally{URL.revokeObjectURL(url)}
}
function hexToRgb(h){const n=parseInt(h.slice(1),16);return [n>>16&255,n>>8&255,n&255]}
function rgbToHex(c){return '#'+c.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('')}
function cdist(a,b){const rm=(a[0]+b[0])/2,dr=a[0]-b[0],dg=a[1]-b[1],db=a[2]-b[2];return Math.sqrt((2+rm/256)*dr*dr+4*dg*dg+(2+(255-rm)/256)*db*db)}
function satOf(c){const mx=Math.max(...c),mn=Math.min(...c);return mx?(mx-mn)/mx:0}
function analyzeColors(px){
  const pts=[];for(let i=0;i<px.length;i+=4){if(px[i+3]>127)pts.push([px[i],px[i+1],px[i+2]])}
  if(!pts.length)return null;
  // ¿Blanco y negro? Si casi ningún píxel tiene color, no se sugiere nada.
  const colourful=pts.filter(p=>satOf(p)>0.18&&Math.max(...p)>40).length/pts.length;
  const K=5;let cs=Array.from({length:K},(_,k)=>pts[Math.floor((k+.5)*pts.length/K)].slice());const asg=new Array(pts.length).fill(0);
  for(let it=0;it<10;it++){
    pts.forEach((p,i)=>{let bi=0,bd=Infinity;cs.forEach((c,j)=>{const d=cdist(p,c);if(d<bd){bd=d;bi=j}});asg[i]=bi});
    const sum=cs.map(()=>[0,0,0,0]);pts.forEach((p,i)=>{const s=sum[asg[i]];s[0]+=p[0];s[1]+=p[1];s[2]+=p[2];s[3]++});
    cs=cs.map((c,j)=>sum[j][3]?[sum[j][0]/sum[j][3],sum[j][1]/sum[j][3],sum[j][2]/sum[j][3]]:c);
  }
  const cl=cs.map((c,j)=>({c,n:asg.filter(a=>a===j).length})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n);
  const palette=cl.map(x=>rgbToHex(x.c));
  if(colourful<0.06)return {palette,suggest:[],bw:true};
  // Solo cuentan los tonos con color: grises, blancos y negros no deciden.
  const score={};
  cl.forEach(({c,n})=>{const sat=satOf(c),mx=Math.max(...c);if(sat<0.15||mx<45)return;
    let best=null,bd=Infinity;S.emotions.forEach(e=>{const d=cdist(c,hexToRgb(e.color));if(d<bd){bd=d;best=e.id}});
    if(best&&bd<330)score[best]=(score[best]||0)+n*(0.4+sat)});
  const tot=Object.values(score).reduce((a,b)=>a+b,0);
  const suggest=tot?Object.entries(score).sort((a,b)=>b[1]-a[1]).filter(([,v])=>v/tot>.15).slice(0,3).map(x=>x[0]):[];
  return {palette,suggest,bw:false};
}

function blobToDataURL(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)})}
function dataURLToBlob(u){const i=u.indexOf(',');const mime=(u.slice(0,i).match(/data:([^;]+)/)||[])[1]||'image/jpeg';const bin=atob(u.slice(i+1));const a=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)a[k]=bin.charCodeAt(k);return new Blob([a],{type:mime})}

/* ---------- Mapa en color e «Ir a un día» ---------- */
let mapRange=null, mapCustomOpen=false;
function mapDefault(){const y=new Date().getFullYear();return {kind:'year',year:y,s:`${y}-01-01`,e:`${y}-12-31`,label:String(y)}}
function byDate(){const ix={};S.memories.forEach(m=>{(ix[m.date]=ix[m.date]||[]).push(m)});return ix}
function dayColorsFrom(ms){const c={};(ms||[]).forEach(m=>emoWeights(m).forEach(([id,w])=>c[id]=(c[id]||0)+w));return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([id])=>emo(id).color)}
function fillCss(cols){if(!cols.length)return '';if(cols.length===1)return `background:${cols[0]}`;return 'background:linear-gradient(to bottom,'+cols.map((c,i)=>`${c} ${i*100/cols.length}% ${(i+1)*100/cols.length}%`).join(',')+')'}
function monthsGrid(r,ix){
  const s=fromIso(r.s),e=fromIso(r.e),today=iso(new Date());const months=[];

function weeksGrid(r,ix){

function rangeDays(r){return Math.round((fromIso(r.e)-fromIso(r.s))/864e5)+1}

async function saveMapImage(){

function timeOf(m){if(m.time&&/^\d{2}:\d{2}$/.test(m.time))return m.time;if(m.createdAt){const d=new Date(m.createdAt);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}return null}

function svgDonut(items,center,sub){
  const tot=items.reduce((a,b)=>a+b.value,0);if(!tot)return '';
  const c=100,r=90,ri=58;let a0=-Math.PI/2,paths='';
  const P=(a,rad)=>[(c+rad*Math.cos(a)).toFixed(2),(c+rad*Math.sin(a)).toFixed(2)];
  items.forEach(it=>{const f=it.value/tot;if(f>=.9999){paths+=`<circle cx="100" cy="100" r="${(r+ri)/2}" fill="none" stroke="${it.color}" stroke-width="${r-ri}"/>`;return}
    const a1=a0+f*Math.PI*2,lg=f>.5?1:0,[x0,y0]=P(a0,r),[x1,y1]=P(a1,r),[x2,y2]=P(a1,ri),[x3,y3]=P(a0,ri);
    paths+=`<path d="M${x0} ${y0}A${r} ${r} 0 ${lg} 1 ${x1} ${y1}L${x2} ${y2}A${ri} ${ri} 0 ${lg} 0 ${x3} ${y3}Z" fill="${it.color}"/>`;a0=a1});
  return `<svg viewBox="0 0 200 200" class="donut" aria-hidden="true">${paths}<text x="100" y="104" text-anchor="middle" class="d-big">${esc(center)}</text><text x="100" y="124" text-anchor="middle" class="d-small">${esc(sub)}</text></svg>`;
}
function svgStack(labels,stacks){
  const W=320,H=150,top=10,bottom=22,pad=6,n=labels.length;
  const max=Math.max(1,...stacks.map(s=>s.reduce((a,b)=>a+b.value,0)));
  const bw=(W-pad*2)/n,gap=Math.min(6,bw*.25),step=Math.ceil(n/8);let g=`<line class="ch-axis" x1="${pad}" x2="${W-pad}" y1="${H-bottom}" y2="${H-bottom}"/>`;
  stacks.forEach((s,i)=>{let y=H-bottom;s.forEach(seg=>{const h=seg.value/max*(H-top-bottom);y-=h;g+=`<rect x="${(pad+i*bw+gap/2).toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(1,bw-gap).toFixed(1)}" height="${Math.max(0,h).toFixed(1)}" fill="${seg.color}" rx="2"/>`})});
  labels.forEach((l,i)=>{if(i%step===0||n<=8)g+=`<text class="ch-t" x="${(pad+i*bw+bw/2).toFixed(1)}" y="${H-7}" text-anchor="middle">${esc(l)}</text>`});

function hbars(rows){const mx=Math.max(1,...rows.map(r=>r.value));return rows.map(r=>`<div class="hbar"><span>${r.label}</span><div class="hb-track"><i style="width:${(r.value/mx*100).toFixed(1)}%;background:${r.color||'var(--accent)'}"></i></div><b>${r.text??r.value}</b></div>`).join('')}
function streaks(){
  const days=new Set(S.memories.map(m=>m.date));let best=0,cur=0;
  const sorted=[...days].sort();let run=0,prev=null;
  sorted.forEach(d=>{run=(prev&&daysAgo(prev)-daysAgo(d)===1)?run+1:1;best=Math.max(best,run);prev=d});

/* ---------- Plus: códigos firmados que se comprueban sin conexión ---------- */
const PLUS_PUBLIC_KEY={"kty":"EC","crv":"P-256","x":"huFeF33CNI2LNXtYfnpk8Np2bbBGDUQzWi-bgHJVcDs","y":"GMj5omm6XUKcW_QKEpJH8ZkB0hfTA2Y-o6X-k_ZGOoU"};
const PLUS_URL='';
function plusBadge(){return `<span class="plus-badge">Plus</span>`}
function b64uToBytes(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a}
async function verifyPlusCode(code){
  try{
    code=String(code||'').replace(/\s+/g,'');if(!code.startsWith('PLUS-'))return null;
    if(!(window.crypto&&crypto.subtle))return null;
    const key=await crypto.subtle.importKey('jwk',PLUS_PUBLIC_KEY,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
    const body=code.slice(5);
    if(!body.includes('.')){
      // Formato corto: 6 bytes (plan + número) y la firma.
      if(body.length!==94)return null;
      const pb=b64uToBytes(body.slice(0,8)),sgb=b64uToBytes(body.slice(8));
      const okS=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},key,sgb,pb);
      if(!okS)return null;
      return {n:'',p:(pb[0]&15)===2?'year':'life',v:pb[0]>>4};
    }
    const [p,sg]=body.split('.');if(!p||!sg)return null;
    const ok=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},key,b64uToBytes(sg),new TextEncoder().encode(p));
    return ok?JSON.parse(new TextDecoder().decode(b64uToBytes(p))):null;
  }catch(e){return null}
}
function plusInfo(){return (S.settings&&S.settings.plus)||null}
function plusState(){const p=plusInfo();if(!p||!plusSigOK)return 'none';if(p.plan==='year'&&p.exp&&p.exp<iso(new Date()))return 'expired';return 'active'}
let plusSigOK=false;
function isPlus(){return plusState()==='active'}
function codeKey(c){return String(c).replace(/\s+/g,'').slice(-24)}
async function checkPlus(){const p=plusInfo();const info=p&&p.code?await verifyPlusCode(p.code):null;const was=isPlus();plusSigOK=!!info;if(info&&p&&!p.plan){p.plan=info.p==='year'?'year':'life'}if(was!==isPlus())render()}
async function activatePlus(code){
  const info=await verifyPlusCode(code);if(!info){toast(t('plusBadCode'));return}
  const clean=String(code).replace(/\s+/g,''),key=codeKey(clean),today=iso(new Date());const cur=plusInfo();
  if(info.p!=='year'){S.settings.plus={code:clean,name:info.n||'',since:today,plan:'life',exp:null,used:(cur&&cur.used)||[]};plusSigOK=true;savePalette();render();toast(t('plusThanks'));return}
  if(cur&&plusSigOK&&cur.plan==='life'){toast(t('tPlusHasLife'));return}
  const used=(cur&&cur.used)||[];if(used.includes(key)){toast(t('tPlusUsed'));return}
  const base=(cur&&cur.plan==='year'&&cur.exp&&cur.exp>=today)?fromIso(cur.exp):fromIso(today);const exp=iso(addDays(base,365));
  S.settings.plus={code:clean,name:info.n||'',since:(cur&&cur.since)||today,plan:'year',exp,used:[...used,key]};plusSigOK=true;savePalette();render();toast(t('tPlusExtended',fmt(exp)));
}

}

  if(i===1)return `<svg viewBox="0 0 380 200" style="width:100%;height:auto;display:block" aria-hidden="true"><rect x="150" y="8" width="80" height="184" rx="16" fill="none" stroke="var(--ink)" stroke-width="3"/><rect x="176" y="18" width="28" height="5" rx="2.5" fill="var(--ink)"/>${[0,1,2,3,4].map(k=>`<rect x="${163+k*11}" y="${70+(k%2)*14}" width="8" height="${80-(k%2)*14}" rx="3" fill="${pick(k*3)}"/>`).join('')}</svg>`;
  if(i>1)i--;
  if(i===0)return `<div class="strip" style="height:110px;grid-template-columns:repeat(21,1fr)">${Array.from({length:21},(_,k)=>((k*7+3)%5===0)?'<span class="day empty"></span>':`<span class="day">${Array.from({length:1+(k%3)},(_,j)=>`<i style="background:${pick(k*3+j*5)}"></i>`).join('')}</span>`).join('')}</div>`;
  if(i===1)return `<div class="row">${S.emotions.map(e=>`<span class="chip" style="--c:${e.color}"><i></i>${esc(e.name)}</span>`).join('')}</div>`;
  if(i===2){const pts=[[60,70],[150,40],[230,90],[120,130],[300,50],[330,130],[200,160]];const ln=[[0,1],[1,2],[0,3],[2,4],[4,5],[2,6],[3,6]];
    return `<svg viewBox="0 0 380 200" style="width:100%;height:auto;display:block" aria-hidden="true">${ln.map(([a,b],k)=>`<line x1="${pts[a][0]}" y1="${pts[a][1]}" x2="${pts[b][0]}" y2="${pts[b][1]}" stroke="var(--muted)" stroke-opacity=".5"${k%2?' stroke-dasharray="4 4"':''}/>`).join('')}${pts.map((p,k)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${9+(k%3)*3}" fill="${pick(k*2)}"/>`).join('')}</svg>`}
  if(i===3)return `<div class="compo" style="height:110px;margin:0">${[.38,.24,.18,.12,.08].map((f,k)=>`<div style="--c:${pick(k)};flex:${f}"></div>`).join('')}</div>`;
  return freqChips('freq-onb',true);
}
function openOnboarding(i=0){
  onb=i;onbOpen=true;const steps=t('onb');const last=onb===steps.length-1;
  const [title,body]=steps[onb];const txt=typeof body==='function'?body(!!cloud):body;
  openDlg(`<div class="dlg-head"><span class="note">${t('of',onb+1,steps.length)}</span>${last?'':`<button class="btn quiet" data-act="onb-done">${t('skip')}</button>`}</div>
  ${onb===0?`<div style="margin-top:14px">${langChips(true)}</div>
  <label class="f" for="onb-name" style="margin-top:20px">${t('onbName')}</label>
  <input class="in" id="onb-name" data-field="pf-name" value="${esc(S.profile.name)}" maxlength="40" placeholder="${esc(t('onbNamePh'))}" autocomplete="nickname">
  <button class="btn quiet" data-act="restore" style="padding-left:0;margin-top:8px">${esc(t('hadMemories'))}</button>`:''}
  <div style="margin:22px 0 6px">${onbArt(onb)}</div>
  <h2 class="detail-title" style="margin-top:22px">${esc(title)}</h2>
  <p class="detail-text" style="font-family:var(--sans);font-size:17px;margin:10px 0 0;max-width:46ch">${esc(txt)}</p>
  <div class="row" style="gap:6px;margin-top:22px" aria-hidden="true">${steps.map((_,j)=>`<span style="width:${j===onb?22:8}px;height:8px;border-radius:999px;background:${j===onb?'var(--ink)':'var(--line)'}"></span>`).join('')}</div>
  <div class="actions">${onb>0?`<button class="btn" data-act="onb-prev">${t('back')}</button>`:''}
    ${last?`<button class="btn primary" data-act="onb-done">${t('start')}</button>${S.memories.length?'':`<button class="btn" data-act="onb-seed">${t('startEx')}</button>`}`:`<button class="btn primary" data-act="onb-next">${t('nextBtn')}</button>`}</div>`);
}

function createType(name){
  name=cut(name,30);
  const ex=allTypeIds().map(typeOf).find(x=>x.label.toLowerCase()===name.toLowerCase());
  if(ex)return ex;
  const nt={id:mkid('t-'),name};S.customTypes.push(nt);savePalette();toast(t('tTypeCreated',name));return nt;
}

function armed(btn,fn){
  if(btn.dataset.armed){fn();return}
  btn.dataset.armed='1';const old=btn.textContent;btn.textContent=btn.dataset.act==='snap-restore'?t('againRestore'):t('again');btn.classList.add('armed');
  setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.textContent=old;btn.classList.remove('armed')}},3500);
}

    if(el.matches('[data-ed-tag]')){e.preventDefault();if(el.value.trim()){addTag(el.value);renderEditor('#ed-tag')}}

    else if(el.matches('[data-ed-newdrawer]')){e.preventDefault();document.querySelector('[data-act="ed-adddrawer"]').click()}

    else if(el.matches('[data-ed-newtype]')){e.preventDefault();document.querySelector('[data-act="ed-addtype"]').click()}

  if(el.matches('[data-share-opt]')&&shareState){shareState[el.dataset.shareOpt]=el.checked;drawShare();return}
  if(el.matches('[data-dayjump]')){if(el.value)openDay(el.value);return}
  if(el.matches('[data-ed-photo]')){const f=el.files&&el.files[0];el.value='';addPhotoToDraft(f);return}
  if(el.id==='story-q'){storyQuote=el.checked;drawStory();return}
  const f=el.dataset.field;
  if(f==='type'||f==='drawer'){filters[f]=el.value;render()}
});

/* =========================================================
   Arranque
   ========================================================= */
if(!window.claude){
  const add=(tag,attrs)=>{const el=document.createElement(tag);Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));document.head.appendChild(el)};
  add('link',{rel:'manifest',href:'manifest.webmanifest',id:'manifest-link'});
  add('link',{rel:'icon',type:'image/png',sizes:'32x32',href:'icons/favicon-32.png'});
  add('link',{rel:'apple-touch-icon',href:'icons/apple-touch-icon.png'});
  add('meta',{name:'apple-mobile-web-app-capable',content:'yes'});
  add('meta',{name:'mobile-web-app-capable',content:'yes'});
  add('meta',{name:'apple-mobile-web-app-title',content:t('brand'),id:'apple-title'});
  add('meta',{name:'apple-mobile-web-app-status-bar-style',content:'default'});
  if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
const local=loadLocal();if(local)S=local;ensureSettings();
applyLang();render();
if(!window.claude&&navigator.storage&&navigator.storage.persist){navigator.storage.persisted().then(x=>{if(!x)return navigator.storage.persist()}).catch(()=>{})}
checkPlus();
initCloud().catch(()=>{}).finally(()=>{checkPlus();ensureSettings();applyLang();autoSnapshot();render();if(!S.settings.onboarded)openOnboarding(0)});

</script>
</body>
</html>
