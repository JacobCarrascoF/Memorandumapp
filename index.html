<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memorándum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEEBF3; --surface:#F9F8FC; --ink:#26233D; --muted:#6C6884; --line:#D9D5E4;
  --accent:#3D3A6B; --on-accent:#F9F8FC; --shadow:0 1px 0 rgba(38,35,61,.06), 0 8px 24px -16px rgba(38,35,61,.35);
  --serif:"Instrument Serif", "Iowan Old Style", Georgia, serif;
  --sans:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#16151E; --surface:#211F2C; --ink:#ECE9F5; --muted:#A29EB8; --line:#363341;
    --accent:#C9C3F0; --on-accent:#1B1A26; --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 28px -18px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#16151E; --surface:#211F2C; --ink:#ECE9F5; --muted:#A29EB8; --line:#363341;
  --accent:#C9C3F0; --on-accent:#1B1A26; --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 28px -18px rgba(0,0,0,.8);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%}

/* ---------- estructura ---------- */
.wrap{max-width:760px;margin:0 auto;padding:0 20px 140px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:22px 0 8px}
.brand{display:flex;flex-direction:column;line-height:1}
.brand b{font-family:var(--serif);font-weight:400;font-size:30px;letter-spacing:-.01em}
.brand span{font-size:13px;color:var(--muted);margin-top:4px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
nav.tabs button{background:none;border:0;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:600}
nav.tabs .plus{justify-self:center;width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--on-accent);padding:0;justify-content:center;margin-top:-18px;box-shadow:var(--shadow)}
nav.tabs .plus span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (min-width:860px){
  nav.tabs{position:static;background:none;backdrop-filter:none;-webkit-backdrop-filter:none;border:0;padding:0;display:flex;gap:4px}
  nav.tabs button{flex-direction:row;font-size:15px;padding:8px 12px;border-radius:999px;gap:6px}
  nav.tabs button svg{width:18px;height:18px}
  nav.tabs button[aria-current="page"]{background:var(--surface)}
  nav.tabs .plus{width:auto;height:auto;border-radius:999px;margin:0 0 0 8px;padding:8px 16px;order:9}
  nav.tabs .plus span{position:static;width:auto;height:auto;overflow:visible;clip:auto}
  .wrap{max-width:860px;padding-bottom:80px}
}

h2.sec{font-family:var(--serif);font-weight:400;font-size:28px;line-height:1.15;margin:40px 0 14px;letter-spacing:-.005em}
p.lead{color:var(--muted);margin:0 0 16px;max-width:60ch}

/* ---------- hoy ---------- */
.greet{font-family:var(--serif);font-weight:400;font-size:clamp(40px,9vw,64px);line-height:1;margin:26px 0 6px;letter-spacing:-.02em}
.today-date{color:var(--muted);margin:0 0 22px}
.strip{display:grid;grid-template-columns:repeat(35,1fr);gap:3px;height:150px;align-items:stretch}
.day{border:0;padding:0;background:none;display:flex;flex-direction:column;gap:2px;border-radius:4px;overflow:hidden;min-width:0}
.day i{flex:1;display:block}
.day.empty{background:linear-gradient(var(--line),var(--line)) center bottom/100% 3px no-repeat}
.day.today{box-shadow:0 0 0 1.5px var(--ink)}
.day:hover:not(.empty){filter:brightness(1.06)}
.strip-cap{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:8px}
@media (prefers-reduced-motion:no-preference){
  .strip.grow .day{transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--n) * 18ms)}
  @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
}
.checkin{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.swatch-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px 6px 6px;font-size:14px}
.swatch-btn i{width:22px;height:22px;border-radius:50%;display:block;background:var(--c)}
.swatch-btn[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}

.resurf{position:relative;border-radius:18px;padding:26px 24px 22px;background:color-mix(in srgb,var(--c) 20%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 40%,var(--line))}
.resurf .when{font-size:14px;color:var(--muted)}
.resurf h3{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.1;margin:6px 0 10px}
.resurf p{font-family:var(--serif);font-style:italic;font-size:21px;line-height:1.4;margin:0 0 16px;max-width:52ch}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* ---------- fichas ---------- */
.fichas{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.ficha{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px 16px 14px 22px;position:relative;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow);min-height:130px}
.ficha::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;border-radius:10px 0 0 10px;background:var(--band)}
.ficha:hover{border-color:color-mix(in srgb,var(--ink) 30%,var(--line))}
.ficha-meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.ficha-title{font-family:var(--serif);font-size:22px;line-height:1.15}
.ficha-source{font-size:13.5px;color:var(--muted);margin-top:-2px}
.ficha-text{font-size:14.5px;color:color-mix(in srgb,var(--ink) 80%,var(--muted));display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ficha-tags{font-size:12.5px;color:var(--muted);margin-top:auto;padding-top:4px}
.month{font-family:var(--serif);font-size:22px;margin:28px 0 10px;color:var(--muted)}
.month:first-letter{text-transform:uppercase}

/* ---------- botones y campos ---------- */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-size:15px;font-weight:500}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.quiet{background:none;border-color:transparent;color:var(--muted);padding-left:8px;padding-right:8px}
.btn.danger{color:#B23A48}
.btn.armed{background:#B23A48;color:#fff;border-color:#B23A48}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:14px}
.chip i{width:12px;height:12px;border-radius:50%;background:var(--c);display:block}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .x{opacity:.6;margin-left:2px}
label.f{display:block;font-size:14px;font-weight:500;margin:18px 0 6px}
label.f small{font-weight:400;color:var(--muted)}
.in,textarea.in,select.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px}
textarea.in{min-height:120px;resize:vertical;font-family:var(--serif);font-size:19px;line-height:1.45}
.search{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 12px}
.search .in{flex:1 1 220px}
.search select.in{flex:0 1 auto;width:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{border:0;background:none;border-radius:999px;padding:6px 14px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.emorow{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px}

/* ---------- paleta ---------- */
.palette{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.pal{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column}
.pal .block{height:110px;background:var(--c);border:0;display:block;width:100%;position:relative}
.pal .block span{position:absolute;right:10px;bottom:8px;font-size:13px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.pal .body{padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px}
.pal .name{border:0;background:none;font-family:var(--serif);font-size:22px;padding:2px 0;width:100%;border-bottom:1px dashed transparent}
.pal .name:focus{border-bottom-color:var(--line);outline:none}
.pal .tools{display:flex;justify-content:space-between;align-items:center}
.pal input[type=color]{width:34px;height:28px;border:1px solid var(--line);border-radius:6px;padding:0;background:none}
.drawers{display:flex;flex-direction:column;gap:8px}
.drawer{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:6px 6px 6px 12px}
.drawer input{flex:1;border:0;background:none;font-size:16px;padding:6px 0}
.drawer small{color:var(--muted);white-space:nowrap}
.note{font-size:14px;color:var(--muted);max-width:60ch}

/* ---------- informe ---------- */
.rep-head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-top:24px}
.period{display:flex;align-items:center;gap:6px}
.period strong{font-family:var(--serif);font-weight:400;font-size:24px;min-width:9ch;text-align:center}
.period strong:first-letter{text-transform:uppercase}
.compo{display:flex;height:220px;border-radius:16px;overflow:hidden;margin:20px 0 10px;border:1px solid var(--line)}
.compo div{background:var(--c);min-width:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.narr{font-family:var(--serif);font-size:24px;line-height:1.4;margin:26px 0 0;max-width:40ch}
.words{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-top:6px}
.words button{border:0;background:none;padding:0;font-family:var(--serif);color:var(--ink)}
.quote{border-left:3px solid var(--c);padding:4px 0 4px 16px;margin:0}
.quote p{font-family:var(--serif);font-style:italic;font-size:22px;line-height:1.4;margin:0 0 6px}
.quote cite{font-style:normal;font-size:14px;color:var(--muted)}
.link{border:0;background:none;padding:0;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line);font-family:var(--serif);font-size:inherit}

/* ---------- constelación ---------- */
.sky{border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden}
.sky svg{display:block;width:100%;height:auto;max-height:70vh}
.sky g.node{cursor:pointer}
.sky g.node:focus{outline:none}
.sky g.node:focus circle.dot{stroke:var(--ink);stroke-width:2}
.sky text{fill:var(--muted);font-family:var(--sans)}

/* ---------- diálogos ---------- */
dialog{border:0;padding:0;background:var(--paper);color:var(--ink);width:min(680px,100%);max-height:100%;border-radius:18px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(20,18,32,.45)}
.dlg{padding:22px 22px 26px;overflow:auto;max-height:calc(100dvh - 40px)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlg-head h2{font-family:var(--serif);font-weight:400;font-size:28px;margin:0}
@media (max-width:640px){
  dialog{width:100%;height:100%;max-width:100%;max-height:100%;border-radius:0;margin:0}
  .dlg{max-height:100%;height:100%;padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(26px + env(safe-area-inset-bottom,0px))}
}
.detail-title{font-family:var(--serif);font-weight:400;font-size:36px;line-height:1.08;margin:14px 0 4px}
.detail-text{font-family:var(--serif);font-size:21px;line-height:1.5;white-space:pre-wrap;margin:18px 0}
.wash{border-radius:14px;padding:18px;background:color-mix(in srgb,var(--c) 16%,var(--surface))}
.mini{display:flex;flex-direction:column;gap:6px}
.mini button{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px}
.mini button i{width:10px;align-self:stretch;border-radius:3px;background:var(--c);flex:none}
.mini button span{display:flex;flex-direction:column;line-height:1.25}
.mini button small{color:var(--muted)}
.err{color:#B23A48;font-size:14px;margin-top:10px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.empty-state{border:1px dashed var(--line);border-radius:16px;padding:28px 22px;margin-top:20px}
.empty-state p{margin:0 0 14px;max-width:52ch}
.story-prev{display:flex;justify-content:center;margin:14px 0}
.story-prev img{width:min(300px,70vw);border-radius:14px;box-shadow:var(--shadow)}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:15px;z-index:50;max-width:calc(100% - 32px);text-align:center;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}
@media (min-width:860px){.toast{bottom:32px}}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>

  <header class="top">
    <div class="brand"><b>Memorándum</b><span id="tagline"></span></div>
    <nav class="tabs" id="nav"></nav>
  </header>
  <main id="main"></main>
</div>
<dialog id="dlg"><div class="dlg" id="dlg-body"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importer" accept="application/json,.json" class="vh" tabindex="-1">

   ========================================================= */
const TYPE_IDS=['dia','libro','pelicula','cancion','lugar','persona','idea'];
const DEFAULT_EMOTIONS=[
  {id:'e-nostalgia',color:'#D4A373'},{id:'e-calma',color:'#8FA9C7'},{id:'e-alegria',color:'#E9C46A'},{id:'e-melancolia',color:'#5B5F97'},

];
const DEFAULT_DRAWERS=['d-lecturas','d-diario','d-pantalla','d-musica','d-lugares'];
const FREQ_DAYS={dia:1,semana:7,mes:30,nunca:0};
function guessLang(){try{return (navigator.language||'').toLowerCase().startsWith('ca')?'ca':'es'}catch(e){return 'es'}}
const DEFAULT_SETTINGS={backupFreq:'semana',lastBackup:null,snoozeUntil:null,onboarded:false,lang:guessLang()};
function freshState(lang){
  const L=I18N[lang]||I18N.es;
  return {emotions:DEFAULT_EMOTIONS.map(e=>({...e,name:L.defEmo[e.id]})),drawers:DEFAULT_DRAWERS.map(id=>({id,name:L.defDrawer[id]})),memories:[],settings:{...DEFAULT_SETTINGS,lang}};
}
let S=freshState(DEFAULT_SETTINGS.lang);
function ensureSettings(){S.settings={...DEFAULT_SETTINGS,...(S.settings||{})};if(!I18N[S.settings.lang])S.settings.lang='es'}

let view='hoy', firstHoy=true;
let filters={q:'',emotion:null,type:'',drawer:'',tag:null,date:null};
let archMode='lista';
let rep={period:'semana',offset:0};

let draft=null, edErr='', linkQ='', newDrawerName='';

/* =========================================================
   Idioma
   ========================================================= */
function lang(){return (S.settings&&I18N[S.settings.lang])?S.settings.lang:'es'}
function t(k,...a){const v=I18N[lang()][k]??I18N.es[k];return typeof v==='function'?v(...a):v}
function typeOf(id){const ty=I18N[lang()].types;return {id:ty[id]?id:'dia',...(ty[id]||ty.dia)}}
function setLang(l){
  if(!I18N[l]||l===lang())return;
  const from=I18N[lang()],to=I18N[l];
  S.emotions.forEach(e=>{if(from.defEmo[e.id]&&e.name===from.defEmo[e.id])e.name=to.defEmo[e.id]});
  S.drawers.forEach(d=>{if(from.defDrawer[d.id]&&d.name===from.defDrawer[d.id])d.name=to.defDrawer[d.id]});
  S.settings.lang=l;applyLang();savePalette();
}
function applyLang(){
  document.documentElement.lang=lang();document.title=t('docTitle');
  $('#tagline').textContent=t('tagline');renderNav();
}

/* =========================================================
   Utilidades
   ========================================================= */
function clone(x){return JSON.parse(JSON.stringify(x))}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mkid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fromIso(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function daysAgo(s){return Math.round((fromIso(iso(new Date()))-fromIso(s))/864e5)}
function fmt(s,o={day:'numeric',month:'long',year:'numeric'}){return fromIso(s).toLocaleDateString(t('locale'),o)}
function fmtD(d,o){return d.toLocaleDateString(t('locale'),o)}
const emo=id=>S.emotions.find(e=>e.id===id);
const drawerOf=id=>S.drawers.find(d=>d.id===id);
const memOf=id=>S.memories.find(m=>m.id===id);
function cut(s,n){s=String(s||'');return s.length>n?s.slice(0,n-1).trimEnd()+'…':s}
function band(m){
  const cs=(m.emotions||[]).map(emo).filter(Boolean);
  if(!cs.length) return 'var(--line)';
  return 'linear-gradient(to bottom,'+cs.map((c,i)=>`${c.color} ${i*100/cs.length}% ${(i+1)*100/cs.length}%`).join(',')+')';
}
function mainColor(m){const e=emo((m.emotions||[])[0]);return e?e.color:'#9A96AE'}
function sorted(ms){return [...ms].sort((a,b)=>b.date.localeCompare(a.date)||(b.createdAt||0)-(a.createdAt||0))}
function joinY(arr){if(arr.length<2)return arr.join('');return arr.slice(0,-1).join(', ')+' '+t('and')+' '+arr[arr.length-1]}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function memTitle(m){return m.title||typeOf(m.type).label}
let toastT;
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),2800)}

/* =========================================================
   Guardado: cuenta (db privada) o este dispositivo
   ========================================================= */
const LS='memorandum.v1';
let cloud=null; let downloads=null;
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function loadLocal(){try{const r=localStorage.getItem(LS);if(r){const p=JSON.parse(r);if(p&&Array.isArray(p.emotions)&&Array.isArray(p.memories))return p}}catch(e){}return null}
async function savePalette(){saveLocal();if(!cloud)return;try{await cloud.paletteDoc.set({emotions:S.emotions,drawers:S.drawers,settings:S.settings})}catch(e){cloudFail()}}
async function saveMem(m){saveLocal();clearTimeout(window._snapT);window._snapT=setTimeout(autoSnapshot,1500);if(!cloud)return;try{await cloud.memCol.doc(m.id).set(clone(m))}catch(e){cloudFail()}}
async function deleteMemCloud(id){saveLocal();if(!cloud)return;try{await cloud.memCol.doc(id).delete()}catch(e){cloudFail()}}
function cloudFail(){toast(t('tCloudFail'))}
async function initCloud(){
  if(!window.claude||typeof window.claude.use!=='function')return;
  claude.use('downloads').then(d=>{downloads=d||null}).catch(()=>{});
  try{
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return;
    const uid=await user.id(); if(!uid)return;
    const paletteDoc=db.doc('data/users/'+uid+'/paleta');
    const memCol=db.doc('data/users/'+uid+'/archivo').collection('recuerdos');
    const [p,ms]=await Promise.all([paletteDoc.get(),memCol.limit(1000).get()]);
    cloud={paletteDoc,memCol};
    if(p.exists){
      const d=p.data();
      S.emotions=clone(d.emotions||S.emotions);S.drawers=clone(d.drawers||[]);
      S.settings={...DEFAULT_SETTINGS,...S.settings,...(d.settings||{}),onboarded:!!(d.settings&&d.settings.onboarded)||S.settings.onboarded};
      S.memories=ms.docs.map(x=>clone(x.data()));
      ensureSettings();saveLocal();
    }else{
      await savePalette();
      for(const m of S.memories){await saveMem(m)}
    }
  }catch(e){cloud=null}
}

/* ---------- Archivo ---------- */
function filtered(){
  const q=filters.q.trim().toLowerCase();
  return sorted(S.memories.filter(m=>{
    if(filters.emotion&&!(m.emotions||[]).includes(filters.emotion))return false;
    if(filters.type&&m.type!==filters.type)return false;
    if(filters.drawer&&m.drawer!==filters.drawer)return false;
    if(filters.tag&&!(m.tags||[]).includes(filters.tag))return false;
    if(filters.date&&m.date!==filters.date)return false;
    if(q){const hay=[m.title,m.source,m.text,...(m.tags||[])].join(' ').toLowerCase();if(!hay.includes(q))return false}
    return true;
  }));
}

/* ---------- Constelación ---------- */
function drawSky(){
  const box=$('#sky');if(!box)return;
  const ms=filtered();
  if(ms.length<2){box.innerHTML=`<div style="padding:24px"><p class="note">${esc(t('skyMin'))}</p></div>`;return}
  const N=ms.length;
  const nodes=ms.map((m,i)=>({m,x:Math.cos(i)*200+Math.random()*40,y:Math.sin(i)*140+Math.random()*40,vx:0,vy:0,deg:0}));
  const idx=new Map(nodes.map((n,i)=>[n.m.id,i]));
  const edges=[],seen=new Set();
  nodes.forEach((n,i)=>(n.m.links||[]).forEach(l=>{const j=idx.get(l);if(j==null)return;const k=i<j?i+'-'+j:j+'-'+i;if(!seen.has(k)){seen.add(k);edges.push({a:i,b:j,s:true})}}));
  for(let i=0;i<N&&edges.length<500;i++)for(let j=i+1;j<N;j++){
    const k=i+'-'+j;if(seen.has(k))continue;
    const ta=nodes[i].m.tags||[],tb=nodes[j].m.tags||[];
    if(ta.some(x=>tb.includes(x))){seen.add(k);edges.push({a:i,b:j,s:false})}
  }
  edges.forEach(e=>{nodes[e.a].deg++;nodes[e.b].deg++});
  for(let it=0;it<320;it++){
    for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){
      const a=nodes[i],b=nodes[j];let dx=a.x-b.x,dy=a.y-b.y;const d2=Math.max(dx*dx+dy*dy,30);const f=2200/d2;const d=Math.sqrt(d2);
      dx/=d;dy/=d;a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f;
    }
    for(const e of edges){
      const a=nodes[e.a],b=nodes[e.b];const dx=b.x-a.x,dy=b.y-a.y;const d=Math.sqrt(dx*dx+dy*dy)||1;
      const L=e.s?70:120,k=e.s?.03:.008;const f=(d-L)*k;a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f;
    }
    for(const n of nodes){n.vx-=n.x*.012;n.vy-=n.y*.012;n.vx*=.82;n.vy*=.82;n.x+=Math.max(-20,Math.min(20,n.vx));n.y+=Math.max(-20,Math.min(20,n.vy))}
  }
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  nodes.forEach(n=>{x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x);y1=Math.max(y1,n.y)});
  const pad=60,w=Math.max(x1-x0,200)+pad*2,h=Math.max(y1-y0,160)+pad*2;
  const fs=Math.max(10,w/62);const showLabels=N<=45;
  let svg=`<svg viewBox="${x0-pad} ${y0-pad} ${w} ${h}" role="group" aria-label="${esc(t('skyLbl'))}">`;
  for(const e of edges){const a=nodes[e.a],b=nodes[e.b];
    svg+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${e.s?'var(--ink)':'var(--muted)'}" stroke-opacity="${e.s?.55:.3}" stroke-width="${e.s?1.6:1}"${e.s?'':' stroke-dasharray="4 4"'}/>`}
  for(const n of nodes){
    const r=6+Math.min(n.deg,8)*1.3;const e2=emo((n.m.emotions||[])[1]);
    svg+=`<g class="node" data-act="open" data-id="${n.m.id}" tabindex="0" role="button" aria-label="${esc(memTitle(n.m))}">
      ${e2?`<circle cx="${n.x}" cy="${n.y}" r="${r+3.5}" fill="none" stroke="${e2.color}" stroke-width="3"/>`:''}
      <circle class="dot" cx="${n.x}" cy="${n.y}" r="${r}" fill="${mainColor(n.m)}"/>
      ${showLabels?`<text x="${n.x}" y="${n.y+r+fs*1.2}" text-anchor="middle" font-size="${fs}">${esc(cut(memTitle(n.m),22))}</text>`:''}
    </g>`;
  }
  box.innerHTML=svg+'</svg>';
}

/* ---------- Informe ---------- */
function range(p,o){
  const now=new Date();now.setHours(0,0,0,0);let s,e,label;
  if(p==='semana'){const dow=(now.getDay()+6)%7;s=addDays(now,-dow+o*7);e=addDays(s,6);
    label=fmtD(s,{day:'numeric',month:'short'})+' – '+fmtD(e,{day:'numeric',month:'short'})}
  else if(p==='mes'){s=new Date(now.getFullYear(),now.getMonth()+o,1);e=new Date(s.getFullYear(),s.getMonth()+1,0);label=fmtD(s,{month:'long',year:'numeric'})}
  else{s=new Date(now.getFullYear()+o,0,1);e=new Date(s.getFullYear(),11,31);label=String(s.getFullYear())}
  return {s:iso(s),e:iso(e),label};
}
function stats(r){
  const ms=S.memories.filter(m=>m.date>=r.s&&m.date<=r.e);
  const ec={},tc={},ty={};const days=new Set();
  ms.forEach(m=>{days.add(m.date);(m.emotions||[]).forEach((id,i)=>{if(emo(id))ec[id]=(ec[id]||0)+(i===0?1:.5)});(m.tags||[]).forEach(x=>tc[x]=(tc[x]||0)+1);ty[m.type]=(ty[m.type]||0)+1});
  const total=Object.values(ec).reduce((a,b)=>a+b,0);
  const emos=Object.entries(ec).sort((a,b)=>b[1]-a[1]).map(([id,v])=>({e:emo(id),share:v/total}));
  const tags=Object.entries(tc).sort((a,b)=>b[1]-a[1]);
  const types=Object.entries(ty).sort((a,b)=>b[1]-a[1]);
  return {ms,emos,tags,types,days:days.size};
}
function discovered(ms){
  let best=null,bs=0;
  for(const a of ms)for(const b of S.memories){
    if(a.id===b.id||a.type===b.type||(a.links||[]).includes(b.id))continue;
    const st=(a.tags||[]).filter(x=>(b.tags||[]).includes(x));const se=(a.emotions||[]).filter(e=>(b.emotions||[]).includes(e));
    const sc=st.length*2+se.length;if(st.length&&se.length&&sc>bs){bs=sc;best={a,b,st,se}}
  }
  return best;
}
function vInforme(){
  const r=range(rep.period,rep.offset),st=stats(r);
  const ps=stats(range(rep.period,rep.offset-1));
  const cur=rep.offset===0;const word=t('word',rep.period,cur);
  let h=`<h1 class="greet" style="font-size:clamp(38px,8vw,54px)">${t('repTitle')}</h1>
  <div class="rep-head">

async function saveDraft(){

}

let storyQuote=false, storyBlob=null;
function storyQuoteCandidate(st){const q=st.ms.filter(m=>m.type==='libro'&&m.text);return q[0]||st.ms.find(m=>m.text)||null}
async function openStory(){
  const st=stats(range(rep.period,rep.offset));
  const q=storyQuoteCandidate(st);
  openDlg(`<div class="dlg-head"><h2>${t('storyTitle')}</h2><button class="btn quiet" data-act="close">${t('close')}</button></div>

  await drawStory();
}
function wrapLines(ctx,text,maxW,maxLines){
  const words=text.split(/\s+/);const lines=[];let cur='';
  for(const w of words){const tt=cur?cur+' '+w:w;if(ctx.measureText(tt).width>maxW&&cur){lines.push(cur);cur=w;if(lines.length===maxLines)break}else cur=tt}
  if(lines.length<maxLines&&cur)lines.push(cur);
  if(lines.length===maxLines&&words.join(' ').length>lines.join(' ').length)lines[maxLines-1]=lines[maxLines-1].replace(/\s*\S*$/,'')+'…';
  return lines;
}
async function drawStory(){
  const r=range(rep.period,rep.offset),st=stats(r);
  try{await Promise.all([document.fonts.load('120px "Instrument Serif"'),document.fonts.load('italic 52px "Instrument Serif"'),document.fonts.load('500 40px Figtree')])}catch(e){}
  const W=1080,H=1920,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const serif='"Instrument Serif", Georgia, serif',sans='Figtree, system-ui, sans-serif';
  x.fillStyle='#1C1A28';x.fillRect(0,0,W,H);
  x.fillStyle='#A9A4C0';x.font=`52px ${serif}`;x.fillText('Memorándum',90,160);
  x.fillStyle='#EFECF7';x.font=`128px ${serif}`;
  const title=t('cardTitle',rep.period);const tw=x.measureText(title).width;if(tw>900)x.font=`${Math.floor(128*900/tw)}px ${serif}`;
  x.fillText(title,90,340);x.font=`italic 128px ${serif}`;x.fillText(t('cardColor'),90,460);
  x.fillStyle='#A9A4C0';x.font=`500 38px ${sans}`;x.fillText(r.label,90,540);
  const bx=90,by=600,bw=900,bh=640;
  x.save();x.beginPath();if(x.roundRect)x.roundRect(bx,by,bw,bh,28);else x.rect(bx,by,bw,bh);x.clip();
  if(st.emos.length){let cx=bx;st.emos.forEach((e,i)=>{const w=i===st.emos.length-1?bx+bw-cx:Math.round(bw*e.share);x.fillStyle=e.e.color;x.fillRect(cx,by,w,bh);cx+=w})}
  else{x.fillStyle='#2C2A3A';x.fillRect(bx,by,bw,bh)}
  x.restore();
  let y=1330;x.font=`500 42px ${sans}`;
  st.emos.slice(0,3).forEach(e=>{x.fillStyle=e.e.color;x.beginPath();x.arc(108,y-14,16,0,Math.PI*2);x.fill();x.fillStyle='#EFECF7';x.textAlign='left';x.fillText(e.e.name,145,y);x.textAlign='right';x.fillStyle='#A9A4C0';x.fillText(Math.round(e.share*100)+'%',990,y);x.textAlign='left';y+=72});
  const incl=$('#story-q')?.checked;const q=storyQuoteCandidate(st);
  if(incl&&q){x.fillStyle='#EFECF7';x.font=`italic 52px ${serif}`;const ls=wrapLines(x,'«'+cut(q.text,160)+'»',900,2);ls.forEach((l,i)=>x.fillText(l,90,1590+i*62))}
  if(st.tags.length){x.fillStyle='#A9A4C0';x.font=`500 36px ${sans}`;x.fillText(wrapLines(x,t('cardWords')+st.tags.slice(0,4).map(z=>z[0]).join(', '),900,1)[0],90,1760)}
  x.fillStyle='#6E6A86';x.font=`500 30px ${sans}`;x.fillText(t('tagline'),90,1860);
  const img=$('#story-img');if(img)img.src=c.toDataURL('image/png');
  storyBlob=await new Promise(res=>c.toBlob(res,'image/png'));
}

/* ---------- Copias ---------- */
async function deliverFile(name,data,mime){
  if(downloads){try{await downloads.save({filename:name,data});return 'ok'}catch(e){if(e&&e.code==='declined')return 'declined'}}
  if(window.claude)return 'fallback';
  const blob=data instanceof Blob?data:new Blob([data],{type:mime});
  try{
    const f=new File([blob],name,{type:mime});
    if(/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Memorándum'});return 'ok'}
  }catch(e){if(e&&e.name==='AbortError')return 'declined'}
  const u=URL.createObjectURL(blob);const el=document.createElement('a');el.href=u;el.download=name;document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);
  return 'ok';
}
async function exportData(){
  const data=JSON.stringify({app:'memorandum',version:1,exportedAt:new Date().toISOString(),...S},null,2);
  const name='memorandum-'+iso(new Date())+'.json';
  const r=await deliverFile(name,data,'application/json');
  if(r==='ok'){S.settings.lastBackup=iso(new Date());S.settings.snoozeUntil=null;savePalette();toast(t('tBackup'));render();return}
  if(r==='declined')return;
  openDlg(`<div class="dlg-head"><h2>${t('yourCopy')}</h2><button class="btn quiet" data-act="close">${t('close')}</button></div><p class="note">${esc(t('copyText'))}</p><textarea class="in" readonly style="min-height:300px;font-family:monospace;font-size:13px">${esc(data)}</textarea>
  <div class="actions"><button class="btn primary" data-act="mark-backup">${esc(t('copied'))}</button></div>`);
}
$('#importer').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const p=JSON.parse(await f.text());
    if(!Array.isArray(p.emotions)||!Array.isArray(p.memories))throw 0;
    const oldIds=S.memories.map(m=>m.id);
    S={emotions:p.emotions,drawers:p.drawers||[],memories:p.memories,settings:{...S.settings,...(p.settings||{}),onboarded:true,lang:lang()}};ensureSettings();
    render();toast(t('tImported',S.memories.length));
    await savePalette();
    if(cloud){for(const id of oldIds)if(!memOf(id))await deleteMemCloud(id);for(const m of S.memories)await saveMem(m)}
  }catch(err){toast(t('tBadFile'))}
});

/* ---------- Aviso de copia y copias automáticas ---------- */
function backupDue(){
  const d=FREQ_DAYS[S.settings.backupFreq];if(!d||!S.memories.length)return false;
  const today=iso(new Date());
  if(S.settings.snoozeUntil&&S.settings.snoozeUntil>today)return false;
  if(!S.settings.lastBackup)return S.memories.length>=3;
  return daysAgo(S.settings.lastBackup)>=d;
}
function backupBanner(){
  if(!backupDue())return '';
  const lb=S.settings.lastBackup;
  return `<div class="wash" style="--c:var(--accent);margin-top:28px"><p style="margin:0 0 12px">${esc(t('due',t('freqAdj')[S.settings.backupFreq])+(lb?t('dueLast',fmt(lb,{day:'numeric',month:'long'})):t('dueNone')))}</p>
  <div class="row"><button class="btn primary" data-act="export">${t('saveBackup')}</button><button class="btn quiet" data-act="backup-later">${esc(t('later'))}</button></div></div>`;
}
const SNAP='memorandum.snapshots';
function getSnaps(){try{return JSON.parse(localStorage.getItem(SNAP)||'[]')}catch(e){return []}}
function autoSnapshot(){
  if(!S.memories.length)return;
  const today=iso(new Date());let snaps=getSnaps();
  if(snaps[0]&&snaps[0].date===today)snaps[0]={date:today,n:S.memories.length,data:S};
  else snaps.unshift({date:today,n:S.memories.length,data:S});
  snaps=snaps.slice(0,7);
  while(snaps.length){try{localStorage.setItem(SNAP,JSON.stringify(snaps));break}catch(e){snaps.pop()}}
}
function snapsHTML(){
  const snaps=getSnaps();if(!snaps.length)return '';
  return `<label class="f">${t('snapsLbl')} <small>${t('snapsSmall')}</small></label>
  <div class="drawers">${snaps.map((x,i)=>`<div class="drawer"><span style="flex:1;padding:6px 0">${esc(cap(fmt(x.date,{weekday:'long',day:'numeric',month:'long'})))}</span><small>${esc(t('nMem',x.n))}</small><button class="btn quiet" data-act="snap-restore" data-v="${i}">${t('restore')}</button></div>`).join('')}</div>`;
}
async function restoreSnap(i){
  const sn=getSnaps()[i];if(!sn)return;
  const oldIds=S.memories.map(m=>m.id);
  const keep=S.settings;S=clone(sn.data);S.settings={...keep};ensureSettings();
  render();toast(t('tRestored',fmt(sn.date,{day:'numeric',month:'long'})));
  await savePalette();
  if(cloud){for(const id of oldIds)if(!memOf(id))await deleteMemCloud(id);for(const m of S.memories)await saveMem(m)}
}

/* ---------- Tutorial ---------- */
let onb=0, onbOpen=false;
function onbArt(i){
  const cols=S.emotions.map(e=>e.color);const pick=n=>cols[n%cols.length]||'#9A96AE';
  if(i===0)return `<div class="strip" style="height:110px;grid-template-columns:repeat(21,1fr)">${Array.from({length:21},(_,k)=>((k*7+3)%5===0)?'<span class="day empty"></span>':`<span class="day">${Array.from({length:1+(k%3)},(_,j)=>`<i style="background:${pick(k*3+j*5)}"></i>`).join('')}</span>`).join('')}</div>`;
  if(i===1)return `<div class="row">${S.emotions.map(e=>`<span class="chip" style="--c:${e.color}"><i></i>${esc(e.name)}</span>`).join('')}</div>`;
  if(i===2){const pts=[[60,70],[150,40],[230,90],[120,130],[300,50],[330,130],[200,160]];const ln=[[0,1],[1,2],[0,3],[2,4],[4,5],[2,6],[3,6]];
    return `<svg viewBox="0 0 380 200" style="width:100%;height:auto;display:block" aria-hidden="true">${ln.map(([a,b],k)=>`<line x1="${pts[a][0]}" y1="${pts[a][1]}" x2="${pts[b][0]}" y2="${pts[b][1]}" stroke="var(--muted)" stroke-opacity=".5"${k%2?' stroke-dasharray="4 4"':''}/>`).join('')}${pts.map((p,k)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${9+(k%3)*3}" fill="${pick(k*2)}"/>`).join('')}</svg>`}
  if(i===3)return `<div class="compo" style="height:110px;margin:0">${[.38,.24,.18,.12,.08].map((f,k)=>`<div style="--c:${pick(k)};flex:${f}"></div>`).join('')}</div>`;
  return freqChips('freq-onb',true);
}
function openOnboarding(i=0){
  onb=i;onbOpen=true;const steps=t('onb');const last=onb===steps.length-1;
  const [title,body]=steps[onb];const txt=typeof body==='function'?body(!!cloud):body;
  openDlg(`<div class="dlg-head"><span class="note">${t('of',onb+1,steps.length)}</span>${last?'':`<button class="btn quiet" data-act="onb-done">${t('skip')}</button>`}</div>
  ${onb===0?`<div style="margin-top:14px">${langChips(true)}</div>`:''}
  <div style="margin:22px 0 6px">${onbArt(onb)}</div>
  <h2 class="detail-title" style="margin-top:22px">${esc(title)}</h2>
  <p class="detail-text" style="font-family:var(--sans);font-size:17px;margin:10px 0 0;max-width:46ch">${esc(txt)}</p>
  <div class="row" style="gap:6px;margin-top:22px" aria-hidden="true">${steps.map((_,j)=>`<span style="width:${j===onb?22:8}px;height:8px;border-radius:999px;background:${j===onb?'var(--ink)':'var(--line)'}"></span>`).join('')}</div>
  <div class="actions">${onb>0?`<button class="btn" data-act="onb-prev">${t('back')}</button>`:''}
    ${last?`<button class="btn primary" data-act="onb-done">${t('start')}</button>${S.memories.length?'':`<button class="btn" data-act="onb-seed">${t('startEx')}</button>`}`:`<button class="btn primary" data-act="onb-next">${t('nextBtn')}</button>`}</div>`);
}
function finishOnboarding(){S.settings.onboarded=true;savePalette();closeDlg()}

/* ---------- Ejemplos ---------- */
async function seed(){
  const d=n=>iso(addDays(new Date(),-n));
  const meta=[ // tipo, fuente, emociones, cajón, días atrás
    ['libro','Gabriel García Márquez',['nostalgia','asombro'],'d-lecturas',2],
    ['dia','',['calma','ternura'],'d-diario',3],
    ['pelicula','Charlotte Wells',['melancolia','ternura'],'d-pantalla',5],
    ['cancion','Miles Davis',['calma','melancolia'],'d-musica',6],
    ['lugar','',['alegria','calma'],'d-lugares',1],
    ['dia','',['alegria','fuerza'],'d-diario',0],
    ['idea','',['asombro'],'',8],
    ['persona','',['nostalgia','ternura'],'',10],
    ['libro','John Williams',['melancolia'],'d-lecturas',12],
    ['dia','',['inquietud','calma'],'d-diario',15],
    ['pelicula','Wim Wenders',['calma','alegria'],'d-pantalla',19],
    ['lugar','',['nostalgia'],'d-lugares',22],
    ['dia','',['inquietud'],'d-diario',26],
    ['cancion','Joan Manuel Serrat',['nostalgia','ternura'],'d-musica',30],
    ['libro','Irene Vallejo',['asombro','ternura'],'d-lecturas',33],
    ['dia','',['calma','nostalgia'],'d-diario',365]
  ];
  const txt=t('seed');const now=Date.now();
  const ms=meta.map((e,i)=>({id:mkid('m')+i,type:e[0],title:txt[i][0],source:e[1],text:txt[i][1],emotions:e[2].map(x=>'e-'+x).filter(id=>emo(id)),tags:txt[i][2],drawer:drawerOf(e[3])?e[3]:'',date:d(e[4]),links:[],createdAt:now-i*1000}));
  const link=(a,b)=>{ms[a].links.push(ms[b].id);ms[b].links.push(ms[a].id)};
  link(2,13);link(0,7);link(11,7);
  S.memories.push(...ms);render();toast(t('tSeed'));
  for(const m of ms)await saveMem(m);
}

/* =========================================================
   Eventos
   ========================================================= */
function armed(btn,fn){
  if(btn.dataset.armed){fn();return}
  btn.dataset.armed='1';const old=btn.textContent;btn.textContent=btn.dataset.act==='snap-restore'?t('againRestore'):t('again');btn.classList.add('armed');
  setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.textContent=old;btn.classList.remove('armed')}},3500);
}
const NOFILTER=()=>({q:'',emotion:null,type:'',drawer:'',tag:null,date:null});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,v=b.dataset.v,id=b.dataset.id;
  switch(a){
    case 'nav':closeDlg();go(v);break;
    case 'new':openEditor(null,{type:b.dataset.type,emo:b.dataset.emo});break;
    case 'open':openDetail(id);break;
    case 'close':closeDlg();break;
    case 'edit':openEditor(id);break;
    case 'del':armed(b,()=>deleteMem(id));break;
    case 'shuffle':{const n=resurfPool().length;resurfIdx=(resurfIdx+1+Math.floor(Math.random()*Math.max(1,n-1)))%Math.max(1,n);render();break}
    case 'seed':seed();break;
    case 'filter-date':filters={...NOFILTER(),date:v};archMode='lista';go('archivo');break;
    case 'filter-emo':filters.emotion=filters.emotion===v?null:v;render();break;
    case 'filter-emo-go':closeDlg();filters={...NOFILTER(),emotion:v};go('archivo');break;
    case 'tag-go':closeDlg();filters={...NOFILTER(),tag:v};go('archivo');break;
    case 'drawer-go':filters={...NOFILTER(),drawer:id};go('archivo');break;
    case 'clear':filters[b.dataset.k]=null;render();break;
    case 'clear-all':filters=NOFILTER();render();break;
    case 'mode':archMode=v;render();break;
    case 'period':rep={period:v,offset:0};render();break;
    case 'prev':rep.offset--;render();break;
    case 'next':if(rep.offset<0){rep.offset++;render()}break;
    case 'story':openStory();break;
    case 'story-save':
      if(storyBlob){deliverFile('memorandum-'+rep.period+'-'+iso(new Date())+'.png',storyBlob,'image/png').then(r=>{if(r==='ok')toast(t('tImg'));else if(r==='fallback')toast(t('tHold'))})}
      break;
    case 'link-pair':{const x=memOf(b.dataset.a),y=memOf(b.dataset.b);if(x&&y){x.links=[...new Set([...(x.links||[]),y.id])];y.links=[...new Set([...(y.links||[]),x.id])];toast(t('tLinked'));render();saveMem(x).then(()=>saveMem(y))}break}
    case 'emo-add':{const pal=['#A3B18A','#F4A261','#9D8189','#6D9DC5','#C08497','#84A59D'];const ne={id:mkid('e-'),name:t('newEmo'),color:pal[S.emotions.length%pal.length]};S.emotions.push(ne);render();savePalette();setTimeout(()=>{const el=document.querySelector(`[data-field="emo-name"][data-id="${ne.id}"]`);if(el){el.focus();el.select()}},30);break}
    case 'emo-del':armed(b,async()=>{S.emotions=S.emotions.filter(x=>x.id!==id);const tt=S.memories.filter(m=>(m.emotions||[]).includes(id));tt.forEach(m=>m.emotions=m.emotions.filter(x=>x!==id));if(filters.emotion===id)filters.emotion=null;render();await savePalette();for(const m of tt)await saveMem(m)});break;
    case 'drawer-add':{const inp=document.querySelector('[data-field="new-drawer-pal"]');const n=(inp?.value||'').trim();if(!n){inp?.focus();break}S.drawers.push({id:mkid('d-'),name:cut(n,40)});render();savePalette();break}
    case 'drawer-del':armed(b,async()=>{S.drawers=S.drawers.filter(x=>x.id!==id);const tt=S.memories.filter(m=>m.drawer===id);tt.forEach(m=>m.drawer='');render();await savePalette();for(const m of tt)await saveMem(m)});break;
    case 'export':exportData();break;
    case 'import':$('#importer').click();break;
    case 'mark-backup':S.settings.lastBackup=iso(new Date());S.settings.snoozeUntil=null;savePalette();closeDlg();render();toast(t('tBackupMarked'));break;
    case 'backup-later':S.settings.snoozeUntil=iso(addDays(new Date(),1));savePalette();render();break;
    case 'freq':S.settings.backupFreq=v;S.settings.snoozeUntil=null;savePalette();render();break;
    case 'freq-onb':S.settings.backupFreq=v;savePalette();openOnboarding(onb);break;
    case 'lang':setLang(v);render();if(onbOpen&&dlg.open)openOnboarding(onb);break;
    case 'snap-restore':armed(b,()=>restoreSnap(+v));break;
    case 'tutorial':openOnboarding(0);break;
    case 'onb-next':openOnboarding(onb+1);break;
    case 'onb-prev':openOnboarding(Math.max(0,onb-1));break;
    case 'onb-done':finishOnboarding();break;
    case 'onb-seed':finishOnboarding();seed();break;
    // editor
    case 'ed-type':draft.type=v;if(!typeOf(v).src)draft.source='';renderEditor();break;
    case 'ed-emo':{const i=draft.emotions.indexOf(v);if(i>=0)draft.emotions.splice(i,1);else if(draft.emotions.length<3)draft.emotions.push(v);else toast(t('max3'));renderEditor();break}
    case 'ed-tag':addTag(v);renderEditor('#ed-tag');break;
    case 'ed-untag':draft.tags=draft.tags.filter(x=>x!==v);renderEditor();break;
    case 'ed-link':{const i=draft.links.indexOf(v);if(i>=0)draft.links.splice(i,1);else draft.links.push(v);renderEditor('#ed-link');break}
    case 'ed-adddrawer':{const n=newDrawerName.trim();if(!n){$('#ed-newdrawer')?.focus();break}const nd={id:mkid('d-'),name:cut(n,40)};S.drawers.push(nd);draft.drawer=nd.id;newDrawerName='';savePalette();renderEditor();break}
    case 'ed-save':saveDraft();break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    const el=e.target;
    if(el.matches('[data-ed-tag]')){e.preventDefault();if(el.value.trim()){addTag(el.value);renderEditor('#ed-tag')}}
    else if(el.matches('g.node')){e.preventDefault();openDetail(el.dataset.id)}
    else if(el.matches('[data-field="new-drawer-pal"]')){e.preventDefault();document.querySelector('[data-act="drawer-add"]').click()}
    else if(el.matches('[data-ed-newdrawer]')){e.preventDefault();document.querySelector('[data-act="ed-adddrawer"]').click()}
  }
  if(e.key===','&&e.target.matches('[data-ed-tag]')){e.preventDefault();if(e.target.value.trim()){addTag(e.target.value);renderEditor('#ed-tag')}}
});
let saveT;
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.ed&&draft){draft[el.dataset.ed]=el.value;return}
  if(el.matches('[data-ed-link]')){linkQ=el.value;renderEditor('#ed-link');return}
  if(el.matches('[data-ed-newdrawer]')){newDrawerName=el.value;return}
  if(el.id==='story-q'){storyQuote=el.checked;drawStory();return}
  const f=el.dataset.field;if(!f)return;
  if(f==='q'){filters.q=el.value;if(archMode==='lista')$('#results').innerHTML=resultsHTML();else drawSky();return}
  if(f==='emo-name'||f==='emo-color'||f==='drawer-name'){
    const list=f==='drawer-name'?S.drawers:S.emotions;const it=list.find(x=>x.id===el.dataset.id);if(!it)return;
    if(f==='emo-color'){it.color=el.value;el.closest('.pal').style.setProperty('--c',el.value)}else it.name=el.value.slice(0,40)||t('noName');
    saveLocal();clearTimeout(saveT);saveT=setTimeout(savePalette,700);
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='story-q'){storyQuote=el.checked;drawStory();return}
  const f=el.dataset.field;
  if(f==='type'||f==='drawer'){filters[f]=el.value;render()}
});

/* =========================================================
   Arranque
   ========================================================= */
const local=loadLocal();if(local)S=local;ensureSettings();
applyLang();render();
initCloud().catch(()=>{}).finally(()=>{ensureSettings();applyLang();autoSnapshot();render();if(!S.settings.onboarded)openOnboarding(0)});

</script>
</body>
